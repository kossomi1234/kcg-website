<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>KCG Owner Dashboard</title>
<style>
:root{--bg:#0e1626;--panel:#16223a;--line:#263553;--ink:#e8edf6;--mute:#94a3bd;--gold:#f5c542;--red:#e5484d;--ok:#3ecf8e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit}
.hide{display:none!important}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px;width:100%;max-width:380px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:17px;margin:0 0 12px}
.sub{color:var(--mute);margin:0 0 18px}
label{display:block;margin:12px 0 4px;color:var(--mute);font-size:13px}
input,select{width:100%;padding:10px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{background:var(--gold);color:#1a1400;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.err{color:var(--red);margin-top:12px;min-height:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
header b{font-size:17px}
main{padding:20px;max-width:1100px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat span{color:var(--mute);font-size:13px}
.stat strong{display:block;font-size:28px;margin-top:2px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{background:transparent;color:var(--mute);border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer}
.tab.on{color:var(--ink);border-color:var(--gold)}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.bar input{flex:1;min-width:160px}.bar select{width:auto}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
td select{padding:5px 8px;width:auto}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;background:var(--bg)}
.empty{padding:24px;color:var(--mute);text-align:center}
.msg{white-space:pre-wrap;max-width:420px}
</style>
</head>
<body>

<section id="login">
  <div class="box">
    <h1>Owner sign in</h1>
    <p class="sub">Kossomi CyberGuard dashboard</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username">
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr"></p>
    <button class="btn" id="go" style="width:100%">Sign in</button>
  </div>
</section>

<section id="app" class="hide">
  <header>
    <b>KCG Owner Dashboard</b>
    <span><span id="me" style="color:var(--mute);margin-right:10px"></span><button class="btn ghost" id="out">Sign out</button></span>
  </header>
  <main>
    <div class="stats">
      <div class="stat"><span>Total members</span><strong id="s1">0</strong></div>
      <div class="stat"><span>Students</span><strong id="s2">0</strong></div>
      <div class="stat"><span>Managers</span><strong id="s3">0</strong></div>
      <div class="stat"><span>Active (last 14 days)</span><strong id="s4">0</strong></div>
      <div class="stat"><span>Messages</span><strong id="s5">0</strong></div>
    </div>
    <div class="tabs">
      <button class="tab on" data-t="users">Users</button>
      <button class="tab" data-t="msgs">Messages</button>
    </div>

    <div id="t-users">
      <div class="bar">
        <input id="q" placeholder="Search name or email">
        <select id="rf"><option value="">All roles</option><option>learner</option><option>manager</option><option>owner</option></select>
        <button class="btn ghost" id="csv">Export CSV</button>
      </div>
      <div class="wrap"><table>
        <thead><tr><th>Name</th><th>Email</th><th>Country</th><th>Role</th><th>Joined</th><th>Last visit</th></tr></thead>
        <tbody id="ub"></tbody>
      </table></div>
    </div>

    <div id="t-msgs" class="hide">
      <div class="wrap"><table>
        <thead><tr><th>Date</th><th>Name</th><th>Email</th><th>Message</th></tr></thead>
        <tbody id="mb"></tbody>
      </table></div>
    </div>
  </main>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
// Keys come from config.js (SUPABASE_URL and SUPABASE_ANON_KEY), so nothing to paste here.
const SB_URL = typeof SUPABASE_URL !== "undefined" ? SUPABASE_URL : "";
const SB_KEY = typeof SUPABASE_ANON_KEY !== "undefined" ? SUPABASE_ANON_KEY : "";

const $ = id => document.getElementById(id);
if (typeof supabase === "undefined" || !SB_URL || !SB_KEY) {
  $("lerr").textContent = "Setup needed: fill SUPABASE_URL and SUPABASE_ANON_KEY in config.js, then open this page from your GitHub site.";
  throw new Error("Setup needed");
}
const db = supabase.createClient(SB_URL, SB_KEY);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}) : "Never";
let users = [];

async function start(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session) return;
  const { data: prof } = await db.from("profiles").select("role,email").eq("id", session.user.id).single();
  if(!prof || prof.role !== "owner"){
    await db.auth.signOut();
    $("lerr").textContent = "This account does not have owner access.";
    return;
  }
  $("login").classList.add("hide"); $("app").classList.remove("hide");
  $("me").textContent = session.user.email;
  load();
}

async function load(){
  const [u, m] = await Promise.all([
    db.rpc("admin_users"),
    db.from("contact_message").select("*").order("created_at",{ascending:false})
  ]);
  users = u.data || [];
  const msgs = m.data || [];
  const cut = Date.now() - 14*864e5;
  $("s1").textContent = users.length;
  $("s2").textContent = users.filter(x=>x.role!=="manager"&&x.role!=="owner").length;
  $("s3").textContent = users.filter(x=>x.role==="manager").length;
  $("s4").textContent = users.filter(x=>x.last_sign_in_at && new Date(x.last_sign_in_at)>cut).length;
  $("s5").textContent = msgs.length;
  drawUsers();
  $("mb").innerHTML = msgs.length ? msgs.map(r=>
    `<tr><td>${fmt(r.created_at)}</td><td>${esc(r.name)}</td><td>${esc(r.email)}</td><td class="msg">${esc(r.message)}</td></tr>`
  ).join("") : `<tr><td colspan="4" class="empty">No messages yet. Contact form submissions will appear here.</td></tr>`;
}

function filtered(){
  const q = $("q").value.toLowerCase(), r = $("rf").value;
  return users.filter(x => (!r || x.role===r) &&
    ((x.full_name||"")+" "+(x.email||"")).toLowerCase().includes(q));
}

function drawUsers(){
  const rows = filtered();
  $("ub").innerHTML = rows.length ? rows.map(x=>`
    <tr><td>${esc(x.full_name||"—")}</td><td>${esc(x.email)}</td><td>${esc(x.country||"—")}</td>
    <td><select data-id="${esc(x.id)}" aria-label="Role for ${esc(x.email)}">
      ${(["learner","manager","owner"].concat(["learner","manager","owner"].includes(x.role)||!x.role?[]:[x.role])).map(r=>`<option ${r===x.role?"selected":""}>${r}</option>`).join("")}
    </select></td>
    <td>${fmt(x.created_at)}</td><td>${fmt(x.last_sign_in_at)}</td></tr>`).join("")
    : `<tr><td colspan="6" class="empty">No users match. Try a different search.</td></tr>`;
}

$("ub").addEventListener("change", async e=>{
  if(e.target.tagName!=="SELECT") return;
  const { error } = await db.from("profiles").update({role:e.target.value}).eq("id", e.target.dataset.id);
  if(error){ alert("Could not change role: "+error.message); } load();
});
$("q").oninput = drawUsers; $("rf").onchange = drawUsers;

$("csv").onclick = ()=>{
  const head = ["Name","Email","Country","Phone","Role","Joined","Last visit"];
  const cell = v => '"'+String(v??"").replace(/"/g,'""')+'"';
  const lines = [head.map(cell).join(",")].concat(filtered().map(x=>
    [x.full_name,x.email,x.country,x.phone,x.role,x.created_at,x.last_sign_in_at].map(cell).join(",")));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/csv"}));
  a.download = "kcg-users.csv"; a.click();
};

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));
  $("t-users").classList.toggle("hide",b.dataset.t!=="users");
  $("t-msgs").classList.toggle("hide",b.dataset.t!=="msgs");
});

$("go").onclick = async ()=>{
  $("lerr").textContent = "";
  const { error } = await db.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  if(error){ $("lerr").textContent = "Wrong email or password."; return; }
  start();
};
$("pw").addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });
$("out").onclick = async ()=>{ await db.auth.signOut(); location.reload(); };

start();
</script>
</body>
</html>
